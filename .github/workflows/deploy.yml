name: Deploy theme

# Every push to main is released as a new theme (a copy of the live one with
# the changes applied), checked through a preview link, then published. The
# theme it replaces stays in Online Store > Themes, so rolling back is one
# click: the "Roll back theme" workflow, or Publish on the old theme.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shopify-live-theme
  cancel-in-progress: false

permissions:
  contents: write # release tags and the theme-editor sync commit
  pull-requests: write # fallback PR when main moves during a deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHOPIFY_FLAG_STORE: vicinity-mart.myshopify.com
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      # The theme that was live before this pipeline ("Vicinity 2.0") matches this commit.
      BOOTSTRAP_BASE_SHA: 79bb3db2232d203aedbbef6fbad944edb1c96ad1
      KEEP_RELEASES: 5
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the Theme Access password is set
        run: |
          if [ -z "$SHOPIFY_CLI_THEME_TOKEN" ]; then
            echo "::error::Add the SHOPIFY_CLI_THEME_TOKEN repository secret (a Theme Access app password)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release tags and the commits live themes were built from

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@4.1.0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Deploy
        run: python3 .github/scripts/deploy.py deploy
